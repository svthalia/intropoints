[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.14"
dependencies = [
    "django-admin-autocomplete-filter>=0.7.1",
    "django-admin-rangefilter>=0.13.5",
    "django-autocompletefilter>=0.0.9",
    "django-cors-headers>=4.9.0",
    "django-import-export>=4.4.0",
    "django-oauth-toolkit>=3.2.0",
    "django-queryable-properties>=1.12.1",
    "djangorestframework>=3.16.1",
    "django-filter>=25.2",
    "django>=5.2.13",
    "oauth2-provider>=0.0",
    "oauthlib>=3.3.1",
    "pillow>=12.1.1",
    "psycopg>=3.3.3",
    "psycopg2-binary>=2.9.11",
    "requests-oauthlib>=2.0.0",
    "ruff>=0.15.7",
    "djangorestframework-stubs>=3.16.8",
    "pre-commit>=4.5.1",
    "drf-spectacular>=0.29.0",
    "drf-spectacular-sidecar>=2026.4.14",
    "boto3>=1.43.13",
    "apscheduler>=3.11.2",
    "django-storages>=1.14.6",
    "uwsgi>=2.0.31",
]

#---------------#
# ruff settings #
#---------------#
[tool.ruff]
target-version = "py314"
line-length = 120
src = ["website"]

# excluds migrations since we don't want to mess with the auto-generated code there.
extend-exclude = ["**/migrations/*.py", "**/core/settings/*.py"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
    "DJ",  # flake8-django
    "PIE", # flake8-pie
    "RET", # flake8-return
    "PTH", # flake8-use-pathlib
    "N",   # pep8-naming
    "S",   # flake8-bandit
    "T20", # flake8-print
    "DTZ", # flake8-datetimez
    "COM", # flake8-commas
    "TID", # flake8-tidy-imports
]

ignore = [
    "B008",   # Do not perform function calls in default args (needed for Django/DRF)
    "COM812", # Trailing comma missing (conflicts with ruff format sometimes)
    "RET504"  # Unnecessary return statement (can be useful for readability)
]

fixable = ["ALL"]
unfixable = ["T20"] # Force manual review for leftover print statements

[tool.ruff.lint.per-file-ignores]
# Migrations
"**/migrations/*.py" = ["E501", "N"] # Ignore long lines, naming, and annotations

# Tests
"**/tests/**/*.py" = ["S101", "T20"] # Allow asserts, prints, and skip strict typing

# Settings
"website/core/settings/*.py" = ["S105", "E501"]   # Allow hardcoded "secrets" (like default dev keys), and long lines in settings file
"**/manage.py" = ["T201"]                         # Allow print in manage.py

[tool.ruff.lint.isort]
# For differentiating between external and internal dependencies for import sorting
known-first-party = [
    "core",
    "challenges",
    "files",
    "login",
    "store",
    "submissions",
    "team",
    "tournament",
    "transaction"
]

[tool.ruff.lint.pep8-naming]
# Without this, N rules can false-positive on Django class-based views
classmethod-decorators = ["classmethod", "django.utils.decorators.method_decorator"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf" # Use LF for line endings, which is standard for Python and works across platforms
