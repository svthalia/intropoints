# --------------------------------- #
# -- -- Global Proxy Settings -- -- #
# --------------------------------- #

# Basic setup#
user              nginx;
worker_processes  auto;
pid        /var/run/nginx.pid;

# Event listener
events {
    worker_connections  1024;
}

# Transport protocol setup
http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Extend TCP session when senting HTTP
    # packets
    tcp_nopush on;
    tcp_nodelay on;

    # Disable extra log information in response
    server_tokens off;

    # /             / #
    # * SSL Headers * #
    # /             / #

    # TLS protocol cipher collection
    #   - Add more ciphers if needed;
    #   - Switch the versions to newer ones in the future;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # Timeouts and caching
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # /             / #
    # * Compression * #
    # /             / #

    # Packet compression using GZIP
    gzip on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types
    application/atom+xml
    application/javascript
    application/json
    application/xml
    application/xml+rss
    image/svg+xml
    text/css
    text/javascript
    text/plain
    text/xml;
    gzip_vary on;

    # Proxy timeouts, redirects & limits
    #   - HTTP bumped to v.2;
    proxy_redirect          off;
    proxy_connect_timeout   60s;
    proxy_send_timeout      60s;
    proxy_read_timeout      60s;
    proxy_http_version      1.1;
    client_max_body_size 300M;

    # /              / #
    # * Base Headers * #
    # /              / #

    # Includes basic server functionality such as:
    #   - SameOrigin resource acces;
    #   - Block cipher mode;
    #   - Disabling unecessary features;
    #   - Strict Transport / Refferal;

    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload";
    add_header Feature-Policy "camera 'none'; xr-spatial-tracking 'none'; accelerometer 'none'; gyroscope 'none'";
    add_header Referrer-Policy strict-origin;
    add_header Expect-CT "max-age=604800";

    # Server specific config
    include /etc/nginx/conf.d/*.conf;
}
