# --------------------------------- #
# -- -- Server Proxy Settings -- -- #
# --------------------------------- #

# Http server
server {
    # /        / #
    # * Domain * #
    # /        / #

    # Listen to port 80 on just IPv4,
    # since this is only for development
    listen 80;

    server_name [DOMAIN NAME];

    # Static files handle
    location /static/ {
        alias /shw/static/;
    }

    # Media handle
    location /media/ {
        alias /shw/media/;
    }

    # /                              / #
    # * Redirects on Pattern Matches * #
    # /                              / #

    # Root page - Frontend
    location / {
        resolver 127.0.0.11;
        proxy_pass "http://frontend";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Server $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
    }

    # Admin page   - Backend
    # Auth handle  - Backend
    # Oauth handle - Backend
    # Login handle - Backend
    # API endpoint - Backend
    location ~ ^/(api|media|admin|auth|login|logout|oauth) {
        include uwsgi_params;
        uwsgi_pass backend:8000;
        add_header X-Frame-Options SAMEORIGIN;
        add_header X-Content-Type-Options nosniff;
        add_header X-XSS-Protection "1; mode=block";
        add_header Referrer-Policy strict-origin;
    }
}
