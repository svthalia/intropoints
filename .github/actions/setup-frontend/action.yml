name: Setup Frontend
description: Node LTS + npm install

runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: lts/*
        cache: npm
        cache-dependency-path: frontend/package.json

    - name: Install dependencies
      shell: bash
      working-directory: frontend
      run: npm install
