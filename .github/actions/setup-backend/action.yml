name: Setup Backend
description: uv (with cache) + python + uv sync

runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true

    - name: Install Python
      shell: bash
      working-directory: backend
      run: uv python install

    - name: Install dependencies
      shell: bash
      working-directory: backend
      run: uv sync
